name: TodoApp CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-test-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore TodoApp.sln

      - name: Build
        run: dotnet build TodoApp.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test TodoApp.sln --configuration Release --no-build --verbosity normal 

      - name: Publish API
        run: dotnet publish TodoApp.Api/TodoApp.Api.csproj --configuration Release --no-build --output ./publish

      - name: Upload publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: todoapp-publish
          path: ./publish